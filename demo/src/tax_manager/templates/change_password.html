{% extends 'base.html' %}
{% block title %}修改密码 · 税务客户管理{% endblock %}
{% block content %}
<div class="page-heading"><div><div class="eyebrow">账号设置</div><h1>修改密码</h1><p>首次登录后请设置一个新密码。</p></div></div>
<section class="panel narrow">
  <form method="post" class="stacked-form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
    <label>当前密码<input name="current_password" type="password" autocomplete="current-password" required></label>
    <label>新密码 <small>至少 10 个字符</small><input name="new_password" type="password" autocomplete="new-password" minlength="10" required></label>
    <label>确认新密码<input name="confirm_password" type="password" autocomplete="new-password" minlength="10" required></label>
    <div class="form-actions"><button class="button primary" type="submit">保存新密码</button><a class="button subtle" href="{{ url_for('customers.index') }}">取消</a></div>
  </form>
</section>
{% endblock %}
