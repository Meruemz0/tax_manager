[project]
name = "tax-manager-demo"
version = "0.1.0"
description = "Small customer and tax filing web app"
requires-python = ">=3.11"
dependencies = [
    "psycopg[binary]==3.3.6",
    "fastapi>=0.142.1",
    "uvicorn>=0.54.0",
    "python-multipart>=0.0.32",
    "click>=8.5.0",
    "jinja2>=3.1.6",
    "itsdangerous>=2.2.0",
    "cryptography>=46,<52",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest==8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
