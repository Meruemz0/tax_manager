[project]
name = "tax-manager-demo"
version = "0.1.0"
description = "Small customer and tax filing web app"
requires-python = ">=3.11"
dependencies = [
    "Flask==3.1.3",
    "psycopg[binary]==3.3.6",
    "Pillow==12.3.0",
    "gunicorn==26.2.0; sys_platform != 'win32'",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
